version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: backstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      POSTGRES_DB: backstage
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 10s
      timeout: 5s
      retries: 5

  backstage:
    image: spotify/backstage:latest
    container_name: backstage-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "7007:7007"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      POSTGRES_DB: backstage
      NODE_ENV: development
    volumes:
      - ./app-config.yaml:/app/app-config.yaml:ro
      - ./app-config.local.yaml:/app/app-config.local.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "packages/backend", "--config", "app-config.yaml"]

volumes:
  postgres-data:
